<html lang="en">
<head>

    <title>Service beyond Online</title>
    <style>
        html,body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
        }
    </style>

<body>
    <iframe id="formframe" src="" frameborder="0"></iframe>
</body>
<script>
        
        function runApp() {
        liff.getProfile().then(profile => {
            let userId = profile.userId;
            let displayName = profile.displayName;
            let pictureUrl = profile.pictureUrl;
            let url = "https://script.google.com/macros/s/AKfycbylM4X7sJm1AA6kFDj6X0RGHsB8RdrFe7sdxWKa2m_RgNHdEYylj96Ecv43P_rXdOIG/exec?userId="+userId+"&displayName="+displayName+"&pictureUrl="+pictureUrl;
        document.getElementById("formframe").src = url;
</script>
